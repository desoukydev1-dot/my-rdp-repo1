name: ci-cd-automation-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: System Optimization
      run: |
        Stop-Service -Name "wuauserv" -Force -ErrorAction SilentlyContinue
        Set-Service -Name "wuauserv" -StartupType Disabled -ErrorAction SilentlyContinue
        Stop-Process -Name "SearchIndexer" -Force -ErrorAction SilentlyContinue
        Write-Output "[MODARK] System optimized."

    - name: Download Ngrok
      run: |
        Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip" -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath "$env:USERPROFILE"
        Remove-Item ngrok.zip
        Copy-Item "$env:USERPROFILE\ngrok.exe" "$env:GITHUB_WORKSPACE"

    - name: Authenticate Ngrok
      run: |
        $ErrorActionPreference = "Stop"
        .\ngrok.exe authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
        Write-Output "[MODARK] Ngrok authenticated."

    - name: Enable RDP & Firewall
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "RDP-Modark" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389
        Write-Output "[MODARK] RDP enabled."

    - name: Create Ultimate User (RIVO) - FINAL FIX
      run: |
        # كلمة مرور قوية لا تحتوي على اسم المستخدم RIVO
        $securePassword = ConvertTo-SecureString "ModarkEvil@2026!" -AsPlainText -Force
        
        # إنشاء المستخدم
        New-LocalUser -Name "RIVO" -Password $securePassword -FullName "Modark User" -Description "Ultimate RDP User" -PasswordNeverExpires
        
        # إضافة للمسؤولين
        Add-LocalGroupMember -Group "Administrators" -Member "RIVO"
        
        Write-Output "[MODARK] User RIVO created successfully with admin rights."

    - name: Establish Tunnel & Extract
      run: |
        Start-Process -FilePath "$pwd\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -NoNewWindow -RedirectStandardOutput ngrok.log
        
        $tunnelUrl = $null
        $timeout = 90 
        
        while ($timeout -gt 0 -and -not $tunnelUrl) {
          Start-Sleep -Seconds 5
          $timeout -= 5
          try {
            $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
            $tunnelUrl = $response.tunnels[0].public_url -replace "tcp://", ""
          } catch {
            $logContent = Get-Content ngrok.log -ErrorAction SilentlyContinue
            $match = $logContent | Select-String -Pattern "tcp://([a-zA-Z0-9\.\-]+:\d+)"
            if ($match) { $tunnelUrl = $match.Matches.Groups[1].Value }
          }
        }

        if (-not $tunnelUrl) { 
          Write-Output "::error::Ngrok tunnel failed."
          exit 1 
        }

        Write-Output "========================================================"
        Write-Output "  MODARK EVIL ULTIMATE RDP CONNECTED"
        Write-Output "========================================================"
        Write-Output "Address: $tunnelUrl"
        Write-Output "Username: RIVO"
        Write-Output "Password: ModarkEvil@2026!"
        Write-Output "========================================================"

    - name: Keep-Alive Loop
      run: |
        while ($true) {
          Write-Output "[MODARK] Pulse: $(Get-Date)"
          Start-Sleep -Seconds 300
        }
